<!-- Modal de Tooltip -->
<div id="tooltipModal" class="tooltip-modal">
    <div class="tooltip-content" role="dialog" aria-modal="true" aria-labelledby="tooltipTitle" aria-describedby="tooltipDescription">
        <button class="tooltip-close" aria-label="Fechar">&times;</button>
        <h3 id="tooltipTitle"></h3>
        <p id="tooltipDescription"></p>
    </div>
</div>
