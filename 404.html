<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>Página não encontrada - Forma Preço</title>
    <link rel="icon" type="image/svg+xml" href="./icons/favicons/favicon.svg" />
    <link rel="stylesheet" href="css/base/variables.css" />
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, var(--bg), var(--bg-gradient-end));
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
        }
        .code {
            font-size: 72px;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin: 0 0 8px;
        }
        h1 {
            font-size: 20px;
            color: var(--text-strong);
            margin: 0 0 8px;
        }
        p {
            color: var(--muted);
            line-height: 1.6;
            margin: 0 0 24px;
        }
        a.btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: var(--radius-medium);
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: background var(--duration-base) var(--ease-standard);
        }
        a.btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

<body>
    <div class="card">
        <p class="code">404</p>
        <h1>Página não encontrada</h1>
        <p>O endereço acessado não existe ou foi movido.</p>
        <a class="btn" href="./">Voltar para o início</a>
    </div>
</body>

</html>
